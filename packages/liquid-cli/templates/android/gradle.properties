# Gradle memory and performance tuning for low-RAM dev environments
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Framework classes only; no AndroidX or Jetifier overhead
android.useAndroidX=false
android.enableJetifier=false

# Override AAPT2 binary to use ARM64 host binary on AArch64 Linux
android.aapt2FromMavenOverride=/usr/bin/aapt2
