name: Build Liquid Dev APK

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/liquid-cli/templates/android/**'
      - 'scripts/build-liquid-dev.sh'
      - '.github/workflows/liquid-dev.yml'
  workflow_dispatch:

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Liquid Dev APK
        run: |
          chmod +x scripts/build-liquid-dev.sh
          ./scripts/build-liquid-dev.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-dev-apk
          path: packages/liquid-cli/templates/android/liquid-dev-app/build/outputs/apk/release/*.apk
